[package]
name = "crud-app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.0", features = ["runtime-tokio-rustls", "postgres", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net"] }
